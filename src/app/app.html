<mat-toolbar>
  <mat-icon aria-hidden="true" svgIcon="logo"></mat-icon>
  <span class="titel">Material tema-demo</span>
  <nav class="meny" aria-label="Huvudmeny">
    <a matButton routerLink="/" routerLinkActive="aktiv" [routerLinkActiveOptions]="{ exact: true }">
      Start
    </a>
    <a matButton routerLink="/skapa" routerLinkActive="aktiv">Skapa</a>
  </nav>
  <span class="flex"></span>
  <mat-button-toggle-group
    class="lage-valjare"
    aria-label="Färgläge"
    hideSingleSelectionIndicator
    [value]="tema.lage()"
    (change)="sattLage($event.value)"
  >
    <mat-button-toggle value="ljust" matTooltip="Ljust" aria-label="Ljust läge">
      <mat-icon>light_mode</mat-icon>
    </mat-button-toggle>
    <mat-button-toggle value="system" matTooltip="Följ systemet" aria-label="Följ systemet">
      <mat-icon>contrast</mat-icon>
    </mat-button-toggle>
    <mat-button-toggle value="morkt" matTooltip="Mörkt" aria-label="Mörkt läge">
      <mat-icon>dark_mode</mat-icon>
    </mat-button-toggle>
  </mat-button-toggle-group>
</mat-toolbar>

<main class="innehall">
  <router-outlet />
</main>
