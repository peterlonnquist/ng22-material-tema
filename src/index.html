<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Material tema-demo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <script>
      // Sätt sparat färgläge innan första rendering, så att sidan inte
      // blinkar i fel läge innan Angular startat. Samma nyckel och klasser
      // som TemaService (src/app/tema/tema.service.ts).
      (function () {
        try {
          var lage = localStorage.getItem('tema-lage');
          if (lage === 'ljust') document.documentElement.classList.add('ljust-tema');
          if (lage === 'morkt') document.documentElement.classList.add('morkt-tema');
        } catch (e) {
          // localStorage kan saknas (t.ex. privat läge)
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
